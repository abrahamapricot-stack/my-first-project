<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothes Hero Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Inter:wght@800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9ecef;
      padding: 20px;
    }

    .banner {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 5 / 3;
      overflow: hidden;
      border-radius: 4px;
      /* Replace this with your photo: url("your-photo.jpg") */
      background:
        linear-gradient(rgba(60, 150, 170, 0.55), rgba(60, 150, 170, 0.55)),
        linear-gradient(180deg, #d9e4e8 0%, #9fb8c0 60%, #6f8a92 100%);
      background-size: cover;
      background-position: center;
    }

    .logo {
      position: absolute;
      top: 5%;
      left: 3%;
      display: flex;
      align-items: center;
      gap: 0.9%;
    }

    .logo-mark {
      width: clamp(60px, 9.5vw, 96px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .logo-mark svg {
      width: 52%;
      height: 52%;
    }

    .logo-text {
      font-family: "Bitter", Georgia, serif;
      font-weight: 700;
      font-size: clamp(14px, 2.3vw, 24px);
      color: #111;
      letter-spacing: 0.2px;
    }

    .slogan {
      position: absolute;
      top: 30%;
      left: 3%;
      width: 60%;
      font-family: "Inter", Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: clamp(26px, 5.8vw, 58px);
      line-height: 1.1;
      color: #000;
      text-indent: -0.4em;
      padding-left: 0.4em;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#000" d="M8 2.5 L3 5.5 L4.8 10 L7 9.2 L7 21.5 L17 21.5 L17 9.2 L19.2 10 L21 5.5 L16 2.5 C15 4.6 9 4.6 8 2.5 Z"/>
        </svg>
      </div>
      <span class="logo-text">clothes hero</span>
    </div>

    <h1 class="slogan">"Dressed for the day you want."</h1>
  </div>
</body>
</html>
